name: C++ CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S cpp -B build

      - name: Build project
        run: cmake --build build

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure